---
- name: Identify the disk the running system boots from
  # lsblk -d reports an empty MOUNTPOINT for a partitioned root volume, because
  # the mountpoint belongs to the partition rather than the disk. Resolving the
  # root disk explicitly is what keeps the selection below from ever choosing
  # it. -s walks up the device tree, so this holds for a plain partition and for
  # LVM alike; -r suppresses the tree glyphs that would otherwise corrupt the name.
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      root_source=$(findmnt -n -o SOURCE / | sed 's/\[.*\]$//')
      lsblk -nrpo NAME,TYPE -s "$root_source" | awk '$2 == "disk" { print $1; exit }'
    executable: /bin/bash
  register: ps97_root_disk
  changed_when: false
  when: ps97_storage_mode == 'volume'

- name: Find candidate data disks
  # A candidate is not the root disk, carries no partitions, and has no
  # filesystem signature of its own. All three conditions are needed: the first
  # two alone would still accept an already-formatted volume.
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      root_disk="{{ ps97_root_disk.stdout }}"
      for disk in $(lsblk -dnp -o NAME,TYPE | awk '$2 == "disk" { print $1 }'); do
          if [ "$disk" = "$root_disk" ]; then
              continue
          fi
          if [ -n "$(lsblk -nr -o NAME "$disk" | tail -n +2)" ]; then
              continue
          fi
          if [ -n "$(lsblk -dnr -o FSTYPE "$disk")" ]; then
              continue
          fi
          printf '%s\n' "$disk"
      done
      exit 0
    executable: /bin/bash
  register: ps97_data_candidates
  changed_when: false
  when: ps97_storage_mode == 'volume'

- name: Fail unless exactly one data disk is attached
  # Exactly one, not at least one: an ambiguous match is how the wrong disk gets
  # formatted, so ambiguity must stop the build rather than pick a winner.
  ansible.builtin.assert:
    that:
      - ps97_data_candidates.stdout_lines | length == 1
    fail_msg: >-
      Expected exactly one unpartitioned, unformatted disk besides the root disk
      {{ ps97_root_disk.stdout }}, found
      {{ ps97_data_candidates.stdout_lines | length }}:
      {{ ps97_data_candidates.stdout_lines | join(', ') }}
  when: ps97_storage_mode == 'volume'

- name: Create the data filesystem
  community.general.filesystem:
    fstype: xfs
    dev: "{{ ps97_data_candidates.stdout_lines[0] }}"
    opts: "-L {{ ps97_data_label }}"
  when: ps97_storage_mode == 'volume'

- name: Mount the data filesystem by label
  # By label, never by device path: the path differs between instance families
  # and a wrong entry here leaves the instance in emergency mode at boot.
  # nofail keeps a missing volume from doing the same.
  ansible.posix.mount:
    path: "{{ ps97_data_mount }}"
    src: "LABEL={{ ps97_data_label }}"
    fstype: xfs
    opts: defaults,nofail
    passno: "2"
    state: mounted
  when: ps97_storage_mode == 'volume'

- name: Create the data mount point
  ansible.builtin.file:
    path: "{{ ps97_data_mount }}"
    state: directory
    mode: "0755"
  when: ps97_storage_mode == 'directory'

- name: Install the SELinux policy tools
  ansible.builtin.dnf:
    name: policycoreutils-python-utils
    state: present

- name: Label the datadir for SELinux
  # The packaged policy labels /var/lib/mysql. Moving the datadir without
  # carrying the label over leaves the server unable to start the moment
  # anyone switches SELinux to enforcing.
  community.general.sefcontext:
    target: "{{ ps97_datadir }}(/.*)?"
    setype: mysqld_db_t
    state: present

- name: Create the datadir
  # Created empty and left that way. mysqld --initialize refuses a non-empty
  # directory, and a datadir populated at bake time would give every instance
  # the same server UUID and the same root credential.
  ansible.builtin.file:
    path: "{{ ps97_datadir }}"
    state: directory
    owner: mysql
    group: mysql
    mode: "0750"

- name: Apply the SELinux context to the datadir
  # Tolerant because this same role runs in a container with no SELinux
  # filesystem mounted. The durable part is the fcontext rule written above,
  # which storage.bats asserts through semanage; relabelling is what a real
  # instance does at boot anyway.
  ansible.builtin.command: restorecon -R {{ ps97_datadir }}
  changed_when: false
  failed_when: false
