---
- name: Install the Percona Server package set
  ansible.builtin.dnf:
    name: "{{ ps97_packages }}"
    state: present

- name: Read the installed server version  # noqa: command-instead-of-module
  ansible.builtin.command: rpm -q --queryformat '%{VERSION}' percona-server-server
  register: ps97_installed_version
  changed_when: false

- name: Fail when the installed version is not the requested version
  # A channel that has not been promoted yet otherwise produces an AMI whose
  # name claims a version it does not contain.
  ansible.builtin.assert:
    that:
      - ps97_installed_version.stdout == ps97_version
    fail_msg: >-
      Requested {{ ps97_version }} but the {{ ps97_repo_channel }} channel
      resolved {{ ps97_installed_version.stdout }}

- name: Read the repository each package was installed from  # noqa: command-instead-of-module
  ansible.builtin.command: >-
    dnf repoquery --installed --qf '%{name}|%{from_repo}'
    percona-server-server percona-server-client percona-xtrabackup-97 percona-toolkit
  register: ps97_origins
  changed_when: false

- name: Fail when a package did not come from the enabled Percona component
  # The vendor field cannot carry this check: Percona populates it for the
  # server packages but leaves it empty for percona-xtrabackup-97, so a vendor
  # match would fail every build. Matching after the pipe separator also keeps
  # the package name, which always contains "percona", from satisfying the test
  # on its own.
  ansible.builtin.assert:
    that:
      - ps97_origins.stdout_lines | length == 4
      - ps97_origins.stdout_lines | select('search', '\|(ps-97-lts|pxb-97-lts|pt)-') | list | length == 4
    fail_msg: >-
      A package did not come from ps-97-lts or pxb-97-lts:
      {{ ps97_origins.stdout }}

- name: Read the installed XtraBackup release  # noqa: command-instead-of-module
  ansible.builtin.command: rpm -q --queryformat '%{VERSION}-%{RELEASE}' percona-xtrabackup-97
  register: ps97_xtrabackup_release
  changed_when: false

- name: Fail when a release candidate would ship on the release channel
  # percona-xtrabackup-97 was still at 9.7.1-1.rc1 in the release channel when
  # this image was designed. A Marketplace candidate must not carry it.
  ansible.builtin.assert:
    that:
      - not (ps97_repo_channel == 'release' and 'rc' in ps97_xtrabackup_release.stdout | lower)
    fail_msg: >-
      XtraBackup {{ ps97_xtrabackup_release.stdout }} is a release candidate.
      Build against the testing channel, or wait for GA.

- name: Report the resolved versions
  ansible.builtin.debug:
    msg: >-
      percona-server-server {{ ps97_installed_version.stdout }},
      percona-xtrabackup-97 {{ ps97_xtrabackup_release.stdout }},
      channel {{ ps97_repo_channel }}
